name: Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target_commit:
        description: "Commit SHA to bind the release artifacts to (default: current HEAD)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  malware-scan:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Scan for known malware indicators
        run: node scripts/security/scan-malware.mjs

  publish-release-artifacts:
    name: Build & Publish Release Artifacts
    needs: malware-scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Validate schema and code consistency
        run: pnpm check

      - name: Generate immutable release artifacts with commit
        env:
          RELEASE_COMMIT: ${{ inputs.target_commit || github.sha }}
        run: |
          pnpm openapi:generate
          echo "Generated release artifacts for commit ${RELEASE_COMMIT}"

      - name: Generate SBOM (Software Bill of Materials)
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          node scripts/generate-sbom.mjs
          echo "Generated CycloneDX and SPDX SBOMs"

      - name: Generate checksums for all release artifacts
        run: |
          mkdir -p docs/release
          cd docs/api
          sha256sum openapi.json openapi.md conformance.json conformance.md checksums.json > checksums.sha256
          cd ../..
          echo "Generated SHA-256 checksums"

      - name: Verify artifact checksums
        run: |
          cd docs/api
          sha256sum -c checksums.sha256
          cd ../..

      - name: Verify release attestations (SBOM, checksums, provenance)
        run: |
          node scripts/verify-release-attestations.mjs

      - name: Generate provenance attestation for artifacts
        uses: actions/attest-build-provenance@5e540f2b55860ae1dd4f5e82f45f9bf26758bcc4 # v1.4.3
        with:
          subject-path: |
            docs/api/openapi.json
            docs/api/openapi.md
            docs/api/conformance.json
            docs/api/conformance.md
            docs/api/checksums.json
            docs/api/checksums.sha256

      - name: Record toolchain metadata
        run: |
          mkdir -p docs/release
          cat > docs/release/toolchain-metadata-${{ github.sha }}.json << 'EOF'
          {
            "buildRunner": "ubuntu-latest",
            "nodeVersion": "24",
            "pnpmVersion": "10.28.0",
            "buildDate": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "gitCommit": "${{ github.sha }}",
            "gitRef": "${{ github.ref }}",
            "workflowId": "${{ github.workflow_ref }}",
            "actionBuildId": "${{ github.run_id }}"
          }
          EOF
          echo "Recorded toolchain metadata"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumenbazaar-api-release-artifacts
          path: |
            docs/api/openapi.json
            docs/api/openapi.md
            docs/api/conformance.json
            docs/api/conformance.md
            docs/api/checksums.json
            docs/api/checksums.sha256
            docs/release/sbom-*.json
            docs/release/toolchain-metadata-*.json
          retention-days: 90

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            docs/api/openapi.json
            docs/api/openapi.md
            docs/api/conformance.json
            docs/api/conformance.md
            docs/api/checksums.json
            docs/api/checksums.sha256
            docs/release/sbom-*.json
            docs/release/toolchain-metadata-*.json
          generate_release_notes: true
